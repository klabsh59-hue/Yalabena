<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07172d">
  <title>طلب خدمة | يلا بينا</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#07172d;--gold:#d6b15e;--muted:#69758a;--line:#dde3ec;--green:#17845c}
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f8;color:#172338}
    header{background:var(--navy);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    header a{color:white;text-decoration:none}.shell{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px}
    .panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .type{border:1px solid var(--line);background:white;border-radius:12px;padding:12px 6px;cursor:pointer;color:#172338}.type.active{border-color:var(--gold);background:#fff9ec}
    label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #ccd4df;border-radius:10px;padding:12px;font-family:inherit}
    textarea{height:70px;resize:vertical}#map{height:520px;border-radius:14px;background:#dde7f1}.estimate{display:flex;justify-content:space-between;align-items:center;background:#edf8f3;border-radius:12px;padding:12px;margin-top:14px}
    .estimate strong{font-size:22px;color:var(--green)}button.primary{width:100%;border:0;border-radius:11px;background:var(--navy);color:white;padding:14px;margin-top:14px;font-weight:bold;cursor:pointer}
    .notice{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#172338;color:white;padding:14px 18px;border-radius:12px;display:none}
    @media(max-width:760px){.shell{padding:12px}.grid{grid-template-columns:1fr}#map{height:360px}.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
<header><a href="index.html">يلا بينا | YALBENA</a><span>طلب تجريبي</span></header>
<main class="shell"><div class="grid">
  <section class="panel">
    <div class="types" aria-label="نوع الطلب">
      <button class="type active" data-type="ride" data-name="مشوار">🚗<br>مشوار</button>
      <button class="type" data-type="parcel" data-name="طرد">📦<br>طرد</button>
      <button class="type" data-type="delivery" data-name="توصيل طلب">🛍️<br>طلب</button>
    </div>
    <label for="pickup">نقطة الانطلاق</label><input id="pickup" value="سوهاج" autocomplete="off">
    <label for="dropoff">الوجهة</label><input id="dropoff" placeholder="مثال: حي غرب سوهاج" autocomplete="off">
    <label for="details">تفاصيل الطلب</label><textarea id="details" placeholder="اكتب ملاحظات أو وصف العنصر المطلوب"></textarea>
    <div class="estimate"><span>السعر التقديري</span><strong id="price">— ج.م</strong></div>
    <button class="primary" id="confirm">تأكيد الطلب التجريبي</button>
    <p class="notice">هذه واجهة معاينة: لا يتم إرسال الطلب إلى كابتن ولا يتم تحصيل دفع. تأكد من العنوانين على الخريطة قبل استخدام الخدمة في الإنتاج.</p>
  </section>
  <section class="panel"><div id="map" aria-label="خريطة سوهاج"></div></section>
</div></main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let selectedType='ride',selectedName='مشوار';
const sohag=[26.5569,31.6948];
const map=L.map('map').setView(sohag,13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let pickupMarker=L.marker(sohag,{draggable:true}).addTo(map).bindPopup('نقطة الانطلاق').openPopup();
let dropMarker=null;
function distanceKm(){if(!dropMarker)return 0;return pickupMarker.getLatLng().distanceTo(dropMarker.getLatLng())/1000}
function estimate(){const km=distanceKm();const base={ride:15,parcel:12,delivery:10}[selectedType];const value=Math.ceil((base+(km*5))/5)*5;document.getElementById('price').textContent=km?value+' ج.م':'حدّد الوجهة'}
map.on('click',e=>{if(!dropMarker){dropMarker=L.marker(e.latlng,{draggable:true}).addTo(map).bindPopup('الوجهة').openPopup();dropMarker.on('dragend',estimate)}else{dropMarker.setLatLng(e.latlng)}estimate()});
pickupMarker.on('dragend',estimate);
document.querySelectorAll('.type').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedType=b.dataset.type;selectedName=b.dataset.name;estimate()}));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(t.timer);t.timer=setTimeout(()=>t.style.display='none',3500)}
document.getElementById('confirm').addEventListener('click',()=>{const drop=document.getElementById('dropoff').value.trim();if(!drop||!dropMarker){toast('اختر وجهة واكتب اسمها أولًا');return}const code='YLB-'+Math.floor(100000+Math.random()*900000);toast('تم إنشاء طلب تجريبي: '+code+' — '+selectedName)});
</script>
</body>
</html>
