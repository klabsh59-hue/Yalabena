<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة يلا بينا</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root{--navy:#07172d;--navy2:#102b4b;--gold:#d6b15e;--paper:#f4f6fa;--ink:#172338;--muted:#68758a;--line:#e3e8ef;--white:#fff;--red:#b63b43;--green:#18794e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(160deg,var(--navy),var(--navy2));color:white;padding:24px 16px}.brand{color:var(--gold);font-size:23px;font-weight:bold;padding:8px 10px 24px}.brand small{display:block;color:#d8e0ea;font-size:12px;font-weight:normal;margin-top:5px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#dce5f0;border:0;text-align:right;padding:13px 14px;border-radius:10px;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:var(--gold)}.main{padding:26px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.top h1{font-size:25px;margin:0}.muted{color:var(--muted);font-size:13px}.btn{border:0;background:var(--gold);color:var(--navy);padding:11px 16px;border-radius:9px;font-weight:bold;cursor:pointer}.btn.dark{background:var(--navy);color:white}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff0f0;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px #12213a08}.card span{color:var(--muted);font-size:13px}.card strong{display:block;font-size:27px;margin-top:10px;color:var(--navy)}.panel{margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;font:inherit;min-width:0}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:bold;background:#fafbfd}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#edf2f8;color:#3b4d66;font-size:11px}.tag.good{background:#e7f6ee;color:var(--green)}.tag.bad{background:#fff0f0;color:var(--red)}.empty{color:var(--muted);padding:24px;text-align:center}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}.field input,.field select{width:100%;color:var(--ink)}.rowactions{display:flex;gap:7px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:9px;background:#fff8e8;color:#765619;font-size:13px;margin-bottom:14px}.login{max-width:420px;margin:9vh auto;background:white;padding:28px;border-radius:18px;border:1px solid var(--line)}.login h1{color:var(--navy)}.login .field{margin:14px 0}.error{color:var(--red);font-size:13px;margin-top:10px}#areaMap{height:390px;border:1px solid var(--line);border-radius:12px;z-index:1}.map-help{font-size:12px;color:var(--muted);line-height:1.8;margin:8px 0 12px}.toast{position:fixed;bottom:18px;left:18px;background:var(--navy);color:white;padding:12px 18px;border-radius:10px;box-shadow:0 6px 25px #0002;z-index:10}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{padding:12px}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.main{padding:16px}.top h1{font-size:20px}}
</style></head><body>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<div id="login" class="login"><div class="brand">يلا بينا <small>YALBENA • لوحة الإدارة</small></div><h1>تسجيل دخول المدير</h1><p class="muted">استخدم حسابًا يحمل صلاحية admin.</p><label class="field">رابط API<input id="api" value="http://localhost:3000/v1" dir="ltr"></label><label class="field">رقم الهاتف<input id="phone" placeholder="+201xxxxxxxxx" dir="ltr"></label><label class="field">كلمة المرور<input id="password" type="password"></label><button class="btn dark" style="width:100%" onclick="login()">دخول آمن</button><div id="loginError" class="error"></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">يلا بينا <small>YALBENA • إدارة التشغيل</small></div><nav class="nav"><button class="active" data-page="overview">نظرة عامة</button><button data-page="users">المستخدمون والكباتن</button><button data-page="merchants">التجار</button><button data-page="areas">مناطق الخدمة</button><button data-page="pricing">التسعير</button><button data-page="orders">الطلبات</button><button data-page="withdrawals">طلبات السحب</button><button data-page="finance">التقارير المالية</button><button data-page="travel">السفر والرحلات</button></nav><button class="btn ghost" style="width:100%;margin-top:22px" onclick="logout()">تسجيل الخروج</button></aside><main class="main"><header class="top"><div><h1 id="pageTitle">نظرة عامة</h1><div class="muted">لوحة تشغيل يلا بينا — سوهاج</div></div><button class="btn ghost" onclick="loadPage(currentPage)">تحديث البيانات</button></header><section id="content"></section></main></div><div id="toast" class="toast hidden"></div>
<script>
let token='',apiBase='http://localhost:3000/v1',currentPage='overview';const titles={overview:'نظرة عامة',users:'المستخدمون والكباتن',merchants:'إدارة التجار',areas:'مناطق الخدمة',pricing:'إدارة التسعير',orders:'متابعة الطلبات',withdrawals:'طلبات سحب الكباتن',finance:'التقارير المالية',travel:'السفر والرحلات'};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
async function request(path,opts={}){const r=await fetch(apiBase+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.message||'تعذر تنفيذ الطلب');return data}
async function login(){apiBase=$('api').value.replace(/\/$/,'');$('loginError').textContent='';try{const r=await fetch(apiBase+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'بيانات الدخول غير صحيحة');token=d.accessToken;if(!d.user.roles.includes('admin'))throw new Error('الحساب لا يحمل صلاحية المدير');$('login').classList.add('hidden');$('app').classList.remove('hidden');loadPage('overview')}catch(e){$('loginError').textContent=e.message}}
function logout(){token='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadPage(b.dataset.page)});
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="12" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div>`}
function statusTag(s){const good=['active','completed','accepted'].includes(s),bad=['suspended','cancelled'].includes(s);return `<span class="tag ${good?'good':bad?'bad':''}">${esc(s||'—')}</span>`}
async function loadPage(page){currentPage=page;$('pageTitle').textContent=titles[page];$('content').innerHTML='<div class="panel empty">جارٍ تحميل البيانات...</div>';try{if(page==='overview')await overview();if(page==='users')await users();if(page==='merchants')await merchants();if(page==='areas')await areas();if(page==='pricing')await pricing();if(page==='orders')await orders();if(page==='withdrawals')await withdrawals();if(page==='finance')await finance();if(page==='travel')await travelAdmin()}catch(e){const panel=document.createElement('div');panel.className='panel error';panel.textContent=e.message||'حدث خطأ غير متوقع';$('content').replaceChildren(panel)}}
async function overview(){const d=await request('/admin/overview');const items=[['المستخدمون',d.users.total],['المستخدمون النشطون',d.users.active],['الكباتن',d.captains.total],['التجار',d.merchants.total],['كل الطلبات',d.orders.total],['الطلبات المفتوحة',d.orders.open],['مناطق الخدمة النشطة',d.serviceAreas.active]];$('content').innerHTML=`<div class="cards">${items.map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>ملاحظات التشغيل</h2><div class="notice">الأسعار ومناطق الخدمة لا تُفعّل افتراضيًا. راجعها واعتمدها قبل استقبال طلبات حقيقية.</div><p class="muted">هذه لوحة إدارة أولية مرتبطة بواجهات API. يلزم إعداد قاعدة البيانات وإنشاء حساب مدير آمن قبل الاستخدام.</p></div>`}
async function users(){const d=await request('/admin/users');const rows=d.items.map(u=>`<tr><td>${esc(u.full_name)}</td><td dir="ltr">${esc(u.phone)}</td><td>${esc((u.roles||[]).join('، '))}</td><td>${statusTag(u.status)}</td><td><div class="rowactions"><button class="btn ghost" onclick="userStatus('${u.id}','${u.status==='active'?'suspended':'active'}')">${u.status==='active'?'إيقاف':'تفعيل'}</button><button class="btn ghost" onclick="role('${u.id}','captain','add')">تعيين كابتن</button></div></td></tr>`).join('');$('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="uq" placeholder="بحث بالاسم أو الهاتف"><button class="btn" onclick="searchUsers()">بحث</button></div>${table(['الاسم','الهاتف','الصلاحيات','الحالة','إجراءات'],rows)}</div>`}
async function searchUsers(){const q=encodeURIComponent($('uq').value);const d=await request('/admin/users?q='+q);const rows=d.items.map(u=>`<tr><td>${esc(u.full_name)}</td><td dir="ltr">${esc(u.phone)}</td><td>${esc((u.roles||[]).join('، '))}</td><td>${statusTag(u.status)}</td><td><div class="rowactions"><button class="btn ghost" onclick="userStatus('${u.id}','${u.status==='active'?'suspended':'active'}')">${u.status==='active'?'إيقاف':'تفعيل'}</button><button class="btn ghost" onclick="role('${u.id}','captain','add')">تعيين كابتن</button></div></td></tr>`).join('');$('content').querySelector('tbody').innerHTML=rows||'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>'}
async function userStatus(id,status){try{await request('/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('تم تحديث حالة المستخدم');loadPage('users')}catch(e){toast(e.message)}}async function role(id,role,action){try{await request('/admin/users/'+id+'/roles',{method:'POST',body:JSON.stringify({role,action})});toast('تم تحديث الصلاحية');loadPage('users')}catch(e){toast(e.message)}}
async function merchants(){const d=await request('/admin/merchants');const rows=d.items.map(m=>`<tr><td>${esc(m.name)}</td><td dir="ltr">${esc(m.phone||'—')}</td><td>${esc(m.serviceAreaName||'—')}</td><td>${statusTag(m.status)}</td><td><button class="btn ghost" onclick="merchantStatus('${m.id}','${m.status==='active'?'suspended':'active'}')">${m.status==='active'?'إيقاف':'تفعيل'}</button></td></tr>`).join('');$('content').innerHTML=`<div class="panel"><h2>إضافة تاجر</h2><div class="formgrid"><label class="field">اسم النشاط<input id="mname"></label><label class="field">الهاتف<input id="mphone" dir="ltr"></label><label class="field">معرّف منطقة الخدمة (اختياري)<input id="marea" dir="ltr"></label></div><button class="btn" style="margin-top:12px" onclick="addMerchant()">إضافة التاجر</button></div><div class="panel">${table(['النشاط','الهاتف','المنطقة','الحالة','إجراء'],rows)}</div>`}
async function addMerchant(){try{await request('/admin/merchants',{method:'POST',body:JSON.stringify({name:$('mname').value,phone:$('mphone').value||undefined,serviceAreaId:$('marea').value||undefined})});toast('تمت إضافة التاجر');loadPage('merchants')}catch(e){toast(e.message)}}async function merchantStatus(id,status){try{await request('/admin/merchants/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('تم تحديث حالة التاجر');loadPage('merchants')}catch(e){toast(e.message)}}
let areaMap=null,areaMarker=null;function centerSohagMap(){if(areaMap)areaMap.setView([26.56,31.70],13)}function setAreaPoint(lat,lng){$('alat').value=Number(lat).toFixed(7);$('alon').value=Number(lng).toFixed(7);if(areaMap){if(areaMarker)areaMarker.setLatLng([lat,lng]);else areaMarker=L.marker([lat,lng]).addTo(areaMap)}}function initAreaMap(items){if(typeof L==='undefined'){$('areaMap').innerHTML='<div class="empty">تعذر تحميل مكتبة الخريطة. تحقق من الاتصال بالإنترنت ثم أعد فتح القسم.</div>';return}if(areaMap){areaMap.remove();areaMap=null;areaMarker=null}areaMap=L.map('areaMap').setView([26.56,31.70],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(areaMap);items.filter(a=>a.latitude!=null&&a.longitude!=null).forEach(a=>L.marker([Number(a.latitude),Number(a.longitude)]).addTo(areaMap).bindPopup(esc(a.nameAr)));areaMap.on('click',e=>setAreaPoint(e.latlng.lat,e.latlng.lng));setTimeout(()=>areaMap.invalidateSize(),100)}async function areas(){const d=await request('/admin/service-areas');const rows=d.items.map(a=>`<tr><td>${esc(a.nameAr)}</td><td>${esc(a.city)}</td><td>${({district:'حي',neighborhood:'منطقة',street:'شارع',landmark:'معلم'})[a.areaKind]||'منطقة فرعية'}</td><td>${statusTag(a.isActive?'active':'inactive')}</td><td><button class="btn ghost" onclick="areaToggle('${a.id}',${!a.isActive})">${a.isActive?'تعطيل':'تفعيل'}</button></td></tr>`).join('');$('content').innerHTML=`<div class="notice"><b>نطاق التغطية المعتمد: مدينة سوهاج بالكامل.</b><br>شرق وغرب وأي تقسيمات أخرى تُدار كمناطق تشغيل وتسعير فرعية، ولا تُعد حدودًا لتغطية المدينة. حدود الخريطة الجغرافية التفصيلية (المضلّع) تحتاج مصدر خرائط موثوق قبل رسمها أو اعتمادها.</div><div class="panel"><h2>خريطة مدينة سوهاج — تحديد نقطة مرجعية للمنطقة</h2><p class="map-help">الخريطة تفاعلية ويمكن الضغط عليها لاختيار نقطة مرجعية للمنطقة. العلامات لا تمثل حدود التغطية الرسمية، ولا تعني أن جميع الشوارع مفعلة تشغيليًا. مصدر الخريطة: OpenStreetMap.</p><div id="areaMap"></div><div class="formgrid" style="margin-top:12px"><label class="field">خط العرض<input id="alat" type="number" step="0.0000001" placeholder="26.55"></label><label class="field">خط الطول<input id="alon" type="number" step="0.0000001" placeholder="31.70"></label></div><button class="btn ghost" style="margin-top:10px" onclick="centerSohagMap()">العودة إلى مركز سوهاج</button></div><div class="panel"><h2>كتالوج أولي لمناطق وشوارع سوهاج</h2><p class="map-help">المواقع المضافة من القائمة الأولية غير مفعلة حتى يراجع المشغل موقعها ونقطة الخريطة. القائمة ليست حصرًا رسميًا كاملًا لكل الشوارع.</p></div><div class="panel"><h2>إضافة منطقة تشغيل أو شارع</h2><div class="formgrid"><label class="field">اسم المنطقة<input id="aname"></label><label class="field">المدينة<input id="acity" value="سوهاج"></label><label class="field">نوع الموقع<select id="akind"><option value="neighborhood">منطقة / حي فرعي</option><option value="street">شارع</option><option value="landmark">معلم</option><option value="district">حي إداري</option></select></label><label class="field">النطاق الأب<select id="aparent"><option value="">بدون — نطاق المدينة</option>${d.items.map(x=>`<option value="${x.id}">${esc(x.nameAr)}</option>`).join('')}</select></label></div><button class="btn" style="margin-top:12px" onclick="addArea()">إضافة المنطقة</button></div><div class="panel">${table(['المنطقة','المدينة','التصنيف','الحالة','إجراء'],rows)}</div>`;initAreaMap(d.items)}
async function addArea(){try{await request('/admin/service-areas',{method:'POST',body:JSON.stringify({nameAr:$('aname').value,city:$('acity').value,areaKind:$('akind').value,parentAreaId:$('aparent')?.value||undefined,latitude:$('alat').value===''?undefined:+$('alat').value,longitude:$('alon').value===''?undefined:+$('alon').value})});toast('تمت إضافة المنطقة');loadPage('areas')}catch(e){toast(e.message)}}async function areaToggle(id,isActive){try{await request('/admin/service-areas/'+id,{method:'PATCH',body:JSON.stringify({isActive})});toast('تم تحديث المنطقة');loadPage('areas')}catch(e){toast(e.message)}}
async function pricing(){const d=await request('/admin/pricing');const names={ride:'مشاوير',food:'مطاعم',market:'ماركت',pharmacy:'صيدليات',parcel:'طرود'};const rows=d.items.map(p=>`<tr><td>${esc(names[p.serviceType]||p.serviceType)}</td><td>${esc(p.serviceAreaName||'كل المناطق')}</td><td>${p.baseFee}</td><td>${p.perKmFee}</td><td>${p.minimumFee}</td><td>${p.serviceFee}</td><td>${p.captainBaseFee||0} + ${p.captainPerKmFee||0}/كم</td><td>${p.platformCommissionPercent||0}%</td><td>${p.launchOfferActive?(p.launchOfferType==='percent'?p.launchOfferValue+'%':p.launchOfferValue+' ج'):'—'}</td><td>${statusTag(p.isActive?'active':'inactive')}</td><td><button class="btn ghost" onclick="priceToggle('${p.id}',${!p.isActive})">${p.isActive?'تعطيل':'تفعيل'}</button></td></tr>`).join('');$('content').innerHTML=`<div class="notice">التعريفات الجديدة غير مفعلة افتراضيًا. لا تعتمد أي قيمة قبل مراجعة تكاليف التشغيل والموافقة الإدارية.</div><div class="panel"><h2>إضافة تعرفة</h2><div class="formgrid"><label class="field">نوع الخدمة<select id="ptype"><option value="ride">مشاوير</option><option value="food">مطاعم</option><option value="market">ماركت</option><option value="pharmacy">صيدليات</option><option value="parcel">طرود</option></select></label><label class="field">معرّف المنطقة (اختياري)<input id="parea" dir="ltr"></label><label class="field">رسوم البداية<input id="pbase" type="number" min="0" value="0"></label><label class="field">سعر الكيلومتر<input id="pkm" type="number" min="0" value="0"></label><label class="field">سعر الدقيقة<input id="pmin" type="number" min="0" value="0"></label><label class="field">الحد الأدنى<input id="pminimum" type="number" min="0" value="0"></label><label class="field">رسوم الخدمة<input id="pservice" type="number" min="0" value="0"></label><label class="field">مستحق الكابتن الأساسي<input id="pcaptainbase" type="number" min="0" value="0"></label><label class="field">مستحق الكابتن لكل كم<input id="pcaptainkm" type="number" min="0" value="0"></label><label class="field">مستحق الكابتن لكل دقيقة<input id="pcaptainmin" type="number" min="0" value="0"></label><label class="field">عمولة المنصة %<input id="pcommission" type="number" min="0" max="100" step="0.01" value="0"></label><label class="field">نوع عرض الافتتاح<select id="poffertype"><option value="none">بدون عرض</option><option value="fixed">خصم ثابت بالجنيه</option><option value="percent">خصم نسبة مئوية</option></select></label><label class="field">قيمة العرض<input id="poffervalue" type="number" min="0" value="0"></label><label class="field">تفعيل عرض الافتتاح<select id="pofferactive"><option value="false">لا</option><option value="true">نعم</option></select></label></div><button class="btn" style="margin-top:12px" onclick="addPricing()">حفظ التعرفة كغير مفعلة</button></div><div class="panel">${table(['الخدمة','المنطقة','البداية','/كم','الحد الأدنى','رسوم الخدمة','مستحق الكابتن','عمولة المنصة','عرض الافتتاح','الحالة','إجراء'],rows)}</div>`}
async function addPricing(){try{await request('/admin/pricing',{method:'POST',body:JSON.stringify({serviceType:$('ptype').value,serviceAreaId:$('parea').value||undefined,baseFee:+$('pbase').value,perKmFee:+$('pkm').value,perMinuteFee:+$('pmin').value,minimumFee:+$('pminimum').value,serviceFee:+$('pservice').value,captainBaseFee:+$('pcaptainbase').value,captainPerKmFee:+$('pcaptainkm').value,captainPerMinuteFee:+$('pcaptainmin').value,platformCommissionPercent:+$('pcommission').value,launchOfferType:$('poffertype').value,launchOfferValue:+$('poffervalue').value,launchOfferActive:$('pofferactive').value==='true',isActive:false})});toast('تم حفظ التعرفة دون تفعيل');loadPage('pricing')}catch(e){toast(e.message)}}async function priceToggle(id,isActive){try{await request('/admin/pricing/'+id+'/activation',{method:'PATCH',body:JSON.stringify({isActive})});toast('تم تحديث التعرفة');loadPage('pricing')}catch(e){toast(e.message)}}

async function finance(){
 const today=new Date().toISOString().slice(0,10),from=new Date(Date.now()-29*86400000).toISOString().slice(0,10);
 $('content').innerHTML=`<div class="panel"><h2>فترة التقرير</h2><div class="toolbar"><label class="field">من تاريخ<input id="finFrom" type="date" value="${from}"></label><label class="field">إلى تاريخ<input id="finTo" type="date" value="${today}"></label><button class="btn" onclick="loadFinance()">عرض التقرير</button></div></div><div id="financeBody" class="panel empty">جارٍ تحميل التقرير...</div>`;
 await loadFinance();
}
async function loadFinance(){try{
 const from=$('finFrom').value,to=$('finTo').value;if(!from||!to||from>to){toast('حدد فترة تاريخ صحيحة');return}
 const d=await request('/wallet/admin/finance?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to));const s=d.summary,w=d.withdrawals;
 const money=v=>Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
 const cards=[['إجمالي مستحقات الطلبات',money(s.completed_order_gross)],['صافي مستحقات الكباتن',money(s.captain_net_earnings)],['عمولة المنصة',money(s.platform_commission)],['طلبات تمت تسويتها',s.settled_orders],['طلبات سحب معلقة',w.pending_count+' • '+money(w.pending_amount)],['طلبات سحب معتمدة',w.approved_count+' • '+money(w.approved_amount)],['مبالغ تم صرفها',money(w.paid_amount)],['عمليات دفتر القيود',s.ledger_entries]];
 const dailyRows=d.daily.map(x=>`<tr><td>${esc(x.day)}</td><td>${money(x.gross)}</td><td>${money(x.captain_net)}</td><td>${money(x.commission)}</td></tr>`).join('');
 const captainRows=d.captains.map(x=>`<tr><td>${esc(x.captain_name)}</td><td dir="ltr">${esc(x.phone)}</td><td>${x.settled_orders}</td><td>${money(x.gross)}</td><td>${money(x.net_earnings)}</td><td>${money(x.platform_commission)}</td></tr>`).join('');
 const txRows=d.transactions.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('ar-EG')}</td><td>${esc(x.captain_name)}</td><td>${esc(x.entry_type)}</td><td>${money(x.amount)}</td><td>${x.commission_amount==null?'—':money(x.commission_amount)}</td><td>${esc(x.description_ar)}</td></tr>`).join('');
 $('financeBody').className='';$('financeBody').innerHTML=`<div class="notice">الأرقام مبنية على قيود المحفظة المسجلة فقط. عمولة المنصة هنا هي العمولة المسجلة عند تسوية الطلبات، وليست صافي ربح الشركة بعد المصروفات والضرائب. الصرف يُحسب بتاريخ التنفيذ الفعلي.</div><div class="cards">${cards.map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>ملخص يومي</h2>${table(['اليوم','إجمالي مستحقات الطلبات','صافي الكابتن','عمولة المنصة'],dailyRows)}</div><div class="panel"><h2>أعلى الكباتن حسب صافي المستحقات</h2>${table(['الكابتن','الهاتف','طلبات مسواة','الإجمالي','الصافي','العمولة'],captainRows)}</div><div class="panel"><h2>آخر قيود الفترة</h2>${table(['التاريخ','الكابتن','نوع القيد','القيمة','العمولة','الوصف'],txRows)}</div>`;
 }catch(e){$('financeBody').className='panel error';$('financeBody').textContent=e.message||'تعذر تحميل التقرير'}}

async function withdrawals(){const d=await request('/wallet/admin/withdrawals');const rows=d.items.map(w=>`<tr><td>${esc(w.captain_name)}<br><small dir="ltr">${esc(w.captain_phone)}</small></td><td>${Number(w.amount).toFixed(2)} ${esc(w.currency)}</td><td>${esc(w.payout_method)}</td><td dir="ltr">${esc(w.payout_destination)}</td><td>${statusTag(w.status)}</td><td>${esc(w.rejection_reason||w.external_reference||'—')}</td><td><div class="rowactions">${w.status==='pending'?`<button class="btn" onclick="reviewWithdrawal('${w.id}','approve')">اعتماد</button><button class="btn danger" onclick="reviewWithdrawal('${w.id}','reject')">رفض</button>`:''}${w.status==='approved'?`<button class="btn dark" onclick="payWithdrawal('${w.id}')">تسجيل الصرف</button>`:''}</div></td></tr>`).join('');$('content').innerHTML=`<div class="notice">اعتماد الطلب يحجز المبلغ ولا ينفذ تحويلًا ماليًا. بعد تنفيذ التحويل خارج النظام، استخدم «تسجيل الصرف» وأدخل المرجع الخارجي. لا تسجل الصرف إلا بعد تنفيذه فعليًا.</div><div class="panel">${table(['الكابتن','المبلغ','الطريقة','وجهة الصرف','الحالة','ملاحظات / مرجع','إجراء'],rows)}</div>`}
async function reviewWithdrawal(id,decision){let body={decision};if(decision==='reject'){const reason=prompt('اكتب سبب رفض طلب السحب:');if(!reason||reason.trim().length<3)return;body.rejectionReason=reason.trim()}try{await request('/wallet/admin/withdrawals/'+id+'/review',{method:'POST',body:JSON.stringify(body)});toast(decision==='approve'?'تم اعتماد طلب السحب وحجز المبلغ':'تم رفض الطلب وإرجاع المبلغ للمحفظة');loadPage('withdrawals')}catch(e){toast(e.message)}}
async function payWithdrawal(id){const ref=prompt('أدخل مرجع التحويل بعد تنفيذ الصرف الفعلي:');if(!ref||ref.trim().length<3)return;try{await request('/wallet/admin/withdrawals/'+id+'/paid',{method:'POST',body:JSON.stringify({externalReference:ref.trim()})});toast('تم تسجيل الصرف');loadPage('withdrawals')}catch(e){toast(e.message)}}
async function orders(){const d=await request('/admin/orders');const rows=d.items.map(o=>`<tr><td>#${o.orderNumber}</td><td>${esc(o.customerName)}<br><small>${esc(o.customerPhone)}</small></td><td>${esc(o.serviceType)}</td><td>${esc(o.captainName||'لم يسند')}</td><td>${statusTag(o.status)}</td><td>${o.totalAmount} ${o.currency}</td><td>${new Date(o.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('');$('content').innerHTML=`<div class="panel">${table(['رقم الطلب','العميل','الخدمة','الكابتن','الحالة','الإجمالي','وقت الإنشاء'],rows)}</div>`}

async function travelAdmin(){const [d,sd]=await Promise.all([request('/travel/admin/entries'),request('/travel/admin/sources')]);const modes={flight:'طيران',train:'قطارات',bus:'أتوبيسات',car:'سيارات'};const sourceTypes={operator:'مشغل نقل',government:'جهة حكومية',aggregator:'منصة تجميع',other:'أخرى'};const rows=d.items.map(x=>`<tr><td>${modes[x.mode]||x.mode}</td><td>${esc(x.originName)} ← ${esc(x.destinationName)}</td><td>${esc(x.titleAr)}</td><td>${esc(x.sourceName)}</td><td>${x.isLive?'<span class="tag good">متحقق حديثًا</span>':x.verificationExpired?'<span class="tag warn">انتهت صلاحية التحقق</span>':'<span class="tag">دليل فقط</span>'}</td><td>${statusTag(x.status)}<br><small>${esc(({confirmed_service:'خدمة مؤكدة بالدليل',no_evidence:'لا يوجد دليل كافٍ',no_service_announced:'لا يوجد إعلان خدمة',needs_followup:'تحتاج متابعة'})[x.researchResult]||'لم يُبحث بعد')}</small>${x.researchedAt?`<br><small>${new Date(x.researchedAt).toLocaleString('ar-EG')}</small>`:''}</td><td><button class="btn ghost" onclick="researchTravelRoute('${x.id}')">تسجيل نتيجة البحث</button><button class="btn ghost" onclick="travelToggle('${x.id}',${!x.isLive})">${x.isLive?'إلغاء التحقق الحي':'اعتماد كبيانات حية'}</button><button class="btn ghost" onclick="travelPublish('${x.id}','${x.status==='published'?'draft':'published'}')">${x.status==='published'?'إخفاء':'نشر'}</button></td></tr>`).join('');const sourceRows=sd.items.map(x=>`<tr><td>${esc(x.sourceName)}</td><td>${sourceTypes[x.sourceType]||x.sourceType}</td><td><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">فتح المصدر</a>${x.lastReviewedUrl?`<br><small><a href="${esc(x.lastReviewedUrl)}" target="_blank" rel="noopener">آخر صفحة تمت مراجعتها</a></small>`:''}</td><td>${x.lastVerifiedAt?new Date(x.lastVerifiedAt).toLocaleString('ar-EG'):'لم تتم المراجعة'}${x.lastReviewSummary?`<br><small>${esc(x.lastReviewSummary)}</small>`:''}</td><td>${x.isActive?'<span class="tag good">نشط</span>':'<span class="tag warn">متوقف</span>'}</td><td><button class="btn ghost" onclick="verifyTravelSource('${x.id}')">تسجيل مراجعة موثقة</button><button class="btn ghost" onclick="toggleTravelSource('${x.id}',${!x.isActive})">${x.isActive?'إيقاف':'تفعيل'}</button></td></tr>`).join('');const sourceOptions=sd.items.filter(x=>x.isActive).map(x=>`<option value="${x.id}">${esc(x.sourceName)} — ${sourceTypes[x.sourceType]||x.sourceType}</option>`).join('');$('content').innerHTML=`<div class="notice">أضف فقط خطوطًا وروابط من مصادر رسمية أو مشغلين موثوقين. يجب تسجيل المصدر أولًا ثم ربط كل خط به. تحديث رابط المصدر أو إيقافه يلغي التحقق من الخطوط المرتبطة به. لا توجد حجوزات أو مقاعد مباشرة في هذا الإصدار.</div><div class="panel"><h2>سجل مصادر النقل</h2><div class="formgrid"><label class="field">اسم المصدر<input id="tsName" placeholder="اسم شركة أو جهة النقل"></label><label class="field">نوع المصدر<select id="tsType"><option value="operator">مشغل نقل</option><option value="government">جهة حكومية</option><option value="aggregator">منصة تجميع</option><option value="other">أخرى</option></select></label><label class="field">الرابط الرسمي<input id="tsUrl" type="url" placeholder="https://..."></label><label class="field">ملاحظات<input id="tsNotes"></label></div><button class="btn" style="margin-top:12px" onclick="addTravelSource()">إضافة المصدر</button><div style="margin-top:16px">${table(['المصدر','النوع','الرابط الرسمي ودليل المراجعة','آخر مراجعة وملخصها','الحالة','إجراءات'],sourceRows)}</div></div><div class="panel"><h2>إضافة خط / معلومة سفر</h2><div class="formgrid"><label class="field">وسيلة السفر<select id="trMode"><option value="flight">الطيران</option><option value="train">السكك الحديدية</option><option value="bus">الأتوبيسات</option><option value="car">السفر بالسيارة</option></select></label><label class="field">من<input id="trFrom" value="سوهاج"></label><label class="field">إلى<input id="trTo" placeholder="الوجهة"></label><label class="field">عنوان العرض<input id="trTitle" placeholder="مثال: خط سوهاج - القاهرة"></label><label class="field">الشركة / المشغل<input id="trOperator"></label><label class="field">المصدر المسجل<select id="trSource">${sourceOptions}</select></label><label class="field">وصف الموعد (اختياري)<input id="trSchedule" placeholder="لا تكتب موعدًا إلا من مصدر موثق"></label><label class="field">المدة (اختياري)<input id="trDuration"></label><label class="field">السعر (اختياري)<input id="trPrice"></label><label class="field">رابط الحجز الرسمي (اختياري)<input id="trBooking" type="url" placeholder="https://..."></label><label class="field">ملاحظات<input id="trNotes"></label><label class="field">حالة النشر<select id="trStatus"><option value="draft">مسودة</option><option value="published">نشر في الدليل</option></select></label></div><button class="btn" style="margin-top:12px" onclick="addTravelEntry()" ${sourceOptions?'':'disabled'}>حفظ العنصر</button>${sourceOptions?'':'<p class="muted">أضف مصدرًا نشطًا أولًا حتى تتمكن من ربط الخط به.</p>'}</div><div class="panel"><h2>تجهيز مسودات بحث لوجهات من سوهاج</h2><p class="muted">هذه قائمة مهام بحث فقط وليست خطوطًا مؤكدة. ستُنشأ كمسودات غير منشورة بلا مواعيد أو أسعار.</p><div class="formgrid"><label class="field">وسيلة البحث<select id="trBatchMode"><option value="train">القطارات</option><option value="bus">الأتوبيسات</option><option value="car">السيارات</option><option value="flight">الطيران</option></select></label><label class="field">مصدر البحث النشط<select id="trBatchSource">${sourceOptions}</select></label><label class="field" style="grid-column:1/-1">الوجهات المقترحة، افصل بينها بفاصلة عربية أو إنجليزية<textarea id="trBatchDestinations" rows="3">القاهرة، الجيزة، أسيوط، قنا، الأقصر، أسوان، المنيا، بني سويف، الغردقة</textarea></label></div><button class="btn" style="margin-top:12px" onclick="createTravelRouteDrafts()" ${sourceOptions?'':'disabled'}>إنشاء مسودات البحث</button></div><div class="panel"><h2>عناصر دليل السفر</h2>${table(['الوسيلة','المسار','العنوان','المصدر','التحقق','النشر','إجراءات'],rows)}</div>`}
async function createTravelRouteDrafts(){try{const destinations=$('trBatchDestinations').value.split(/[،,\n]/).map(x=>x.trim()).filter(Boolean);if(!destinations.length){toast('أدخل وجهة واحدة على الأقل');return}const result=await request('/travel/admin/route-drafts/batch',{method:'POST',body:JSON.stringify({mode:$('trBatchMode').value,sourceId:$('trBatchSource').value,destinations})});toast(`تم إنشاء ${result.created} مسودة، وتجاوز ${result.skipped} مكررة`);loadPage('travel')}catch(e){toast(e.message)}}
async function addTravelSource(){try{await request('/travel/admin/sources',{method:'POST',body:JSON.stringify({sourceName:$('tsName').value,sourceType:$('tsType').value,sourceUrl:$('tsUrl').value,notesAr:$('tsNotes').value||undefined})});toast('تم تسجيل المصدر');loadPage('travel')}catch(e){toast(e.message)}}
async function verifyTravelSource(id){const reviewedUrl=prompt('الصق رابط الصفحة الرسمية التي راجعتها (يجب أن تكون على نفس نطاق المصدر):');if(!reviewedUrl||!reviewedUrl.trim())return;const reviewSummary=prompt('اكتب ملخصًا لما راجعته (10 أحرف على الأقل)، مثل توفر صفحة الجداول أو بيانات الحجز:');if(!reviewSummary||reviewSummary.trim().length<10)return;try{await request('/travel/admin/sources/'+id+'/verify',{method:'POST',body:JSON.stringify({reviewedUrl:reviewedUrl.trim(),reviewSummary:reviewSummary.trim()})});toast('تم حفظ المراجعة ورابط الدليل في السجل التاريخي');loadPage('travel')}catch(e){toast(e.message)}}
async function toggleTravelSource(id,isActive){try{await request('/travel/admin/sources/'+id,{method:'PATCH',body:JSON.stringify({isActive})});toast(isActive?'تم تفعيل المصدر':'تم إيقاف المصدر وإلغاء تحقق الخطوط المرتبطة');loadPage('travel')}catch(e){toast(e.message)}}
async function addTravelEntry(){try{const body={mode:$('trMode').value,originName:$('trFrom').value,destinationName:$('trTo').value,titleAr:$('trTitle').value,sourceId:$('trSource').value,operatorName:$('trOperator').value||undefined,scheduleLabel:$('trSchedule').value||undefined,durationLabel:$('trDuration').value||undefined,priceLabel:$('trPrice').value||undefined,bookingUrl:$('trBooking').value||undefined,notesAr:$('trNotes').value||undefined,status:$('trStatus').value,isLive:false};await request('/travel/admin/entries',{method:'POST',body:JSON.stringify(body)});toast('تم حفظ العنصر؛ البيانات الحية غير مفعلة');loadPage('travel')}catch(e){toast(e.message)}}
async function researchTravelRoute(id){const result=prompt('نتيجة البحث: confirmed_service أو no_evidence أو no_service_announced أو needs_followup');if(!['confirmed_service','no_evidence','no_service_announced','needs_followup'].includes(result))return;const evidenceUrl=prompt('رابط الدليل الرسمي (إلزامي عند تأكيد الخدمة):')||'';const summary=prompt('ملخص ما تم التحقق منه (10 أحرف على الأقل):');if(!summary||summary.trim().length<10)return;try{await request('/travel/admin/entries/'+id+'/research',{method:'POST',body:JSON.stringify({result,evidenceUrl:evidenceUrl.trim()||undefined,summary:summary.trim()})});toast('تم حفظ نتيجة البحث');loadPage('travel')}catch(e){toast(e.message)}}
async function travelToggle(id,isLive){if(isLive&&!confirm('هل راجعت الموعد الآن من المصدر الرسمي؟'))return;try{await request('/travel/admin/entries/'+id,{method:'PATCH',body:JSON.stringify({isLive})});toast('تم تحديث حالة التحقق');loadPage('travel')}catch(e){toast(e.message)}}
async function travelPublish(id,status){try{await request('/travel/admin/entries/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('تم تحديث حالة النشر');loadPage('travel')}catch(e){toast(e.message)}}

</script></body></html>
