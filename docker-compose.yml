services:
  postgres:
    image: postgres:16-alpine
    container_name: yalbena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yalbena
      POSTGRES_USER: yalbena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yalbena_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yalbena -d yalbena"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  yalbena_postgres_data:
