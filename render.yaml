# Render Blueprint for YALBENA
# Create the services from this file in the user's Render account.
services:
  - type: web
    name: yalbena-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate:database
    startCommand: node dist/main.js
    healthCheckPath: /v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yalbena-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: CORS_ORIGINS
        sync: false
      - key: ROUTING_PROVIDER_URL
        sync: false
      - key: TRAVEL_VERIFICATION_TTL_HOURS
        value: 24
  - type: web
    name: yalbena-preview
    runtime: static
    rootDir: web-preview
    buildCommand: echo "Static YALBENA preview"
    staticPublishPath: .

databases:
  - name: yalbena-db
    databaseName: yalbena
    user: yalbena
    plan: basic-256mb
